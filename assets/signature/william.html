        <script>
            // Declare the function as async
            const copySignature = async (signatureEl) => {
                if (signatureEl) {
                    const signatureContent = signatureEl.innerHTML;
                    const blob = new Blob([signatureContent], { type: 'text/html' });
                    const clipboardItem = new ClipboardItem({ 'text/html': blob });

                    console.log('Signature content:', signatureContent);

                    // Check for clipboard API support
                    if (!navigator.clipboard || !window.ClipboardItem) {
                        alert("Clipboard API not supported");
                        console.error("Clipboard API not supported");
                        return;
                    }

                    try {
                        await navigator.clipboard.write([clipboardItem]);
                        alert("De handtekening is naar het klembord gekopieerd");
                    } catch (err) {
                        console.error("Error copying content: ", err);
                        alert("Kan de handtekening niet kopiëren: " + err.message);
                    }
                } else {
                    alert("Kan de handtekening niet kopiëren");
                }
            }
        </script>
